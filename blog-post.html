<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5F0E8">
  <title>Blog — ClearNest</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Cpath d='M13 53 Q18 44 36 43 Q54 44 59 53' fill='%23D4B896' stroke='%23C4A878' stroke-width='1.5' stroke-linecap='round'/%3E%3Cellipse cx='36' cy='54' rx='23' ry='6' fill='%23D4B896' stroke='%23C4A878' stroke-width='1.5'/%3E%3Cellipse cx='36' cy='36' rx='11' ry='9' fill='%239B7BC8'/%3E%3Ccircle cx='36' cy='24' r='8' fill='%239B7BC8'/%3E%3C/svg%3E">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #F5F0E8;
      --cream-deep: #EDE6DC;
      --purple: #9B7BC8;
      --purple-deep: #7E5EAC;
      --ink: #3D1F8A;
      --ink-soft: #4A3D6B;
      --badge-bg: #EDE0FF;
      --gold: #F4C842;
      --white: #fff;
      --muted: #5C5470;
      --line: rgba(61, 31, 138, 0.1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--cream);
      color: var(--ink-soft);
      font-size: 17px;
      line-height: 1.65;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(245, 240, 232, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px 20px;
      list-style: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      text-decoration: none;
      color: inherit;
      transition: color 0.15s;
    }

    .nav-links a:hover {
      color: var(--purple);
    }

    .nav-cta {
      background: var(--purple);
      color: #fff !important;
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.15s, transform 0.15s;
    }

    .nav-cta:hover {
      background: var(--purple-deep);
      color: #fff !important;
      transform: translateY(-1px);
    }

    /* ── Loading / Error ── */
    .state-wrap {
      max-width: 480px;
      margin: 72px auto;
      padding: 40px 28px;
      text-align: center;
      background: var(--white);
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 32px rgba(61, 31, 138, 0.06);
    }

    .state-wrap h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .state-wrap p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .state-wrap a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 22px;
      color: var(--purple);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .state-wrap a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Hero ── */
    .post-hero {
      position: relative;
      padding: 40px 20px 56px;
      overflow: hidden;
    }

    .post-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(155, 123, 200, 0.18), transparent 55%),
        linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .post-hero-inner {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    .article-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--ink);
      margin-bottom: 18px;
    }

    .post-hero h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .article-desc {
      font-size: clamp(17px, 2.2vw, 19px);
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 20px;
      max-width: 640px;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .article-meta time {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .article-meta time::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .article-cover-wrap {
      max-width: 900px;
      margin: 32px auto 0;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    .article-cover {
      width: 100%;
      max-height: min(52vh, 440px);
      object-fit: cover;
      border-radius: 16px;
      display: block;
      box-shadow:
        0 20px 50px rgba(61, 31, 138, 0.12),
        0 0 0 1px rgba(61, 31, 138, 0.06);
    }

    /* ── Article paper ── */
    .post-shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px 48px;
      position: relative;
      z-index: 2;
    }

    .post-shell--tight .post-paper {
      margin-top: 20px;
    }

    .post-paper {
      background: var(--white);
      border-radius: 20px;
      padding: 44px 40px 52px;
      margin-top: -28px;
      box-shadow:
        0 4px 40px rgba(61, 31, 138, 0.08),
        0 0 0 1px var(--line);
    }

    @media (max-width: 640px) {
      .post-shell--tight .post-paper {
        margin-top: 16px;
      }

      .post-paper {
        padding: 32px 22px 40px;
        margin-top: -20px;
        border-radius: 16px;
      }

      .post-hero {
        padding: 28px 16px 40px;
      }

      .article-cover-wrap {
        padding: 0 16px;
      }
    }

    .article-body {
      max-width: 100%;
    }

    .article-body > p:first-of-type {
      font-size: 18px;
      line-height: 1.75;
      color: var(--ink-soft);
    }

    .article-body h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      color: var(--ink);
      margin: 40px 0 14px;
      line-height: 1.25;
      padding-top: 8px;
      border-top: 3px solid var(--gold);
      max-width: 100%;
    }

    .article-body h2:first-child {
      margin-top: 0;
      border-top: none;
      padding-top: 0;
    }

    .article-body h3 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin: 28px 0 10px;
    }

    .article-body p {
      font-size: 17px;
      line-height: 1.8;
      color: #3a3548;
      margin-bottom: 1.15em;
    }

    .article-body ul,
    .article-body ol {
      padding-left: 1.35em;
      margin-bottom: 1.15em;
    }

    .article-body li {
      font-size: 17px;
      line-height: 1.75;
      color: #3a3548;
      margin-bottom: 0.45em;
    }

    .article-body li::marker {
      color: var(--purple);
    }

    .article-body b,
    .article-body strong {
      font-weight: 600;
      color: var(--ink);
    }

    .article-body a {
      color: var(--purple-deep);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .article-body a:hover {
      color: var(--ink);
    }

    .article-body blockquote {
      margin: 28px 0;
      padding: 20px 24px 20px 22px;
      border-left: 4px solid var(--purple);
      background: linear-gradient(90deg, var(--badge-bg) 0%, rgba(237, 224, 255, 0.35) 100%);
      border-radius: 0 12px 12px 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 18px;
      line-height: 1.65;
      color: var(--ink);
    }

    .article-body img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 24px 0;
      box-shadow: 0 8px 28px rgba(61, 31, 138, 0.08);
    }

    .article-body hr {
      border: none;
      height: 1px;
      background: var(--line);
      margin: 36px 0;
    }

    .article-body code {
      font-size: 0.9em;
      background: var(--badge-bg);
      padding: 2px 7px;
      border-radius: 6px;
      color: var(--ink);
    }

    .article-body pre {
      background: #2d2640;
      color: #f3f0ff;
      padding: 18px 20px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 24px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .article-body pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    /* ── End of article ── */
    .article-end {
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .article-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--purple);
      text-decoration: none;
      transition: gap 0.2s;
    }

    .article-back-link:hover {
      gap: 12px;
      color: var(--ink);
    }

    /* ── CTA ── */
    .article-cta-wrap {
      padding: 0 20px 64px;
    }

    .article-cta-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .article-cta {
      position: relative;
      background: linear-gradient(135deg, var(--badge-bg) 0%, #f5f0ff 50%, var(--cream) 100%);
      border-radius: 20px;
      padding: 40px 32px 44px;
      text-align: center;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .article-cta::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--purple), var(--gold), var(--purple));
      opacity: 0.85;
    }

    .article-cta h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .article-cta p {
      color: var(--muted);
      font-size: 16px;
      max-width: 420px;
      margin: 0 auto 22px;
      line-height: 1.55;
    }

    .article-cta-btn {
      display: inline-block;
      background: var(--purple);
      color: #fff;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(155, 123, 200, 0.35);
    }

    .article-cta-btn:hover {
      background: var(--purple-deep);
      transform: translateY(-2px);
    }

    .article-cta .article-back {
      display: block;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    .article-cta .article-back:hover {
      color: var(--purple);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    footer {
      background: var(--white);
      border-top: 1px solid var(--line);
      padding: 22px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    footer a {
      color: var(--purple-deep);
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Skeleton ── */
    .skel {
      animation: shimmer 1.4s ease-in-out infinite;
      background: linear-gradient(90deg, #e8e0f0 0%, #f2ecf8 50%, #e8e0f0 100%);
      background-size: 200% 100%;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="landing.html">
        <svg width="28" height="28" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M13 53 Q18 44 36 43 Q54 44 59 53" fill="#D4B896" stroke="#C4A878" stroke-width="1.5"
            stroke-linecap="round" />
          <ellipse cx="36" cy="54" rx="23" ry="6" fill="#D4B896" stroke="#C4A878" stroke-width="1.5" />
          <path d="M17 52 Q24 48 32 47" fill="none" stroke="#B8946A" stroke-width="1" stroke-linecap="round" />
          <path d="M55 52 Q48 48 40 47" fill="none" stroke="#B8946A" stroke-width="1" stroke-linecap="round" />
          <ellipse cx="36" cy="36" rx="11" ry="9" fill="#9B7BC8" />
          <circle cx="36" cy="24" r="8" fill="#9B7BC8" />
          <ellipse cx="36.5" cy="38" rx="6.5" ry="5" fill="#C4A8E8" />
          <path d="M25 34 Q21 28 25 22 Q31 19 36 26 Q30 28 28 34Z" fill="#7B58A8" opacity="0.7" />
          <circle cx="39" cy="22" r="2" fill="#2A1248" />
          <circle cx="39.6" cy="21.4" r="0.7" fill="#fff" />
          <path d="M43 23.5 L48 22.5 L43 26 Z" fill="#F4A261" />
          <path d="M25 38 Q19 42 16 48 Q21 43 27 41Z" fill="#7B58A8" opacity="0.6" />
          <path d="M30 47 L27 52 M30 47 L30 53 M30 47 L33 52" stroke="#C4A878" stroke-width="1.3"
            stroke-linecap="round" />
          <path d="M42 47 L39 52 M42 47 L42 53 M42 47 L45 52" stroke="#C4A878" stroke-width="1.3"
            stroke-linecap="round" />
        </svg>
        ClearNest
      </a>
      <ul class="nav-links">
        <li><a href="landing.html#how">How it works</a></li>
        <li><a href="landing.html#covers">What Clara covers</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="landing.html#waitlist" class="nav-cta">Priority access</a></li>
      </ul>
    </div>
  </nav>

  <div id="page-content">
    <div class="post-hero" id="skel-header">
      <div class="post-hero-inner">
        <div class="skel" style="width:100px;height:26px;margin-bottom:20px;border-radius:999px"></div>
        <div class="skel" style="width:100%;height:40px;margin-bottom:12px"></div>
        <div class="skel" style="width:88%;height:40px;margin-bottom:20px"></div>
        <div class="skel" style="width:70%;height:20px;margin-bottom:12px"></div>
        <div class="skel" style="width:160px;height:18px;border-radius:6px"></div>
      </div>
    </div>
    <div class="post-shell">
      <div class="post-paper">
        <div class="article-body">
          <div class="skel" style="width:100%;height:18px;margin-bottom:14px"></div>
          <div class="skel" style="width:96%;height:18px;margin-bottom:14px"></div>
          <div class="skel" style="width:88%;height:18px;margin-bottom:28px"></div>
          <div class="skel" style="width:45%;height:24px;margin-bottom:16px"></div>
          <div class="skel" style="width:100%;height:18px;margin-bottom:14px"></div>
          <div class="skel" style="width:92%;height:18px;margin-bottom:14px"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Pannon Ltd ·
    <a href="blog.html">← Back to blog</a> ·
    <a href="/privacy">Privacy</a>
  </footer>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    const SUPA_URL = import.meta.env.VITE_SUPA_URL;
    const SUPA_KEY = import.meta.env.VITE_SUPA_KEY;
    const sb = createClient(SUPA_URL, SUPA_KEY);

    const CATEGORY_COLOURS = {
      'Care Planning': '#7E5EAC',
      'Legal & Financial': '#5B7BB8',
      'Family': '#C9785A',
      'News & Updates': '#4A9B6E',
      'ClearNest News': '#C9785A',
      'Guides': '#7E5EAC',
      'General': '#6B6280',
      'Real Stories': '#5B7BB8',
      'Research': '#D4A524',
      'Opinion': '#4A9B6E',
      'Interviews': '#5B7BB8',
    };

    function catColour(c) { return CATEGORY_COLOURS[c] || '#9B7BC8'; }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        renderError('No post ID specified.', 'Head back to the blog to find an article.');
        return;
      }

      const { data: post, error } = await sb
        .from('blog_posts')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !post) {
        renderError('Post not found.', "We couldn't find this article. It may have been removed.");
        return;
      }

      renderPost(post);
    }

    function renderPost(post) {
      document.title = post.title + ' — ClearNest';

      const dateStr = new Date(post.date_posted).toLocaleDateString('en-GB', {
        day: 'numeric', month: 'long', year: 'numeric'
      });

      const colour = catColour(post.category);

      const hasCover = Boolean(post.picture_url);
      const coverImg = hasCover
        ? '<div class="article-cover-wrap"><img class="article-cover" src="' + esc(post.picture_url) + '" alt="' + esc(post.title) + '" loading="eager" onerror="this.parentElement.style.display=\'none\';var p=document.querySelector(\'#page-content .post-shell\');if(p)p.classList.add(\'post-shell--tight\');"></div>'
        : '';

      const shellClass = 'post-shell' + (hasCover ? '' : ' post-shell--tight');

      const bodyContent = post.content
        ? post.content
        : '<p style="color:#6B6280;font-style:italic">This post has no additional content yet.</p>';

      document.getElementById('page-content').innerHTML =
        '<header class="post-hero">'
        + '<div class="post-hero-inner">'
        + '<span class="article-pill" style="color:' + colour + ';background:' + colour + '22;border:1px solid ' + colour + '33">' + esc(post.category) + '</span>'
        + '<h1>' + esc(post.title) + '</h1>'
        + '<p class="article-desc">' + esc(post.description) + '</p>'
        + '<div class="article-meta"><time datetime="' + esc(post.date_posted) + '">ClearNest · ' + dateStr + '</time></div>'
        + '</div>'
        + '</header>'
        + coverImg
        + '<div class="' + shellClass + '">'
        + '<div class="post-paper">'
        + '<div class="article-body">'
        + bodyContent
        + '</div>'
        + '<div class="article-end">'
        + '<a href="blog.html" class="article-back-link" aria-label="Back to all articles">← All articles</a>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '<div class="article-cta-wrap">'
        + '<div class="article-cta-inner">'
        + '<div class="article-cta">'
        + '<h2>Ready to get organised?</h2>'
        + '<p>When the details live in one person\'s head, the stress lands on the family. Clara helps you capture what matters—gently.</p>'
        + '<a href="landing.html#waitlist" class="article-cta-btn">Get priority access</a>'
        + '<a href="blog.html" class="article-back">← Back to all articles</a>'
        + '</div>'
        + '</div>'
        + '</div>';
    }

    function renderError(title, message) {
      document.getElementById('page-content').innerHTML =
        '<div class="state-wrap">'
        + '<h2>' + esc(title) + '</h2>'
        + '<p>' + esc(message) + '</p>'
        + '<a href="blog.html">← Back to blog</a>'
        + '</div>';
    }

    loadPost();
  </script>
</body>
